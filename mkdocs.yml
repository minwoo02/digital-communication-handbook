site_name: Digital Communication Handbook
site_url: https://minwoo02.github.io/digital-communication-handbook/
repo_url: https://github.com/minwoo02/digital-communication-handbook
theme:
  language: ko
  features:
  - navigation.tabs
  - navigation.top
  - content.code.copy
  - toc.follow
  - navigation.path
  palette:
  - scheme: default
    primary: indigo
    accent: teal
    toggle:
      icon: material/brightness-4
      name: 다크 모드
  - scheme: slate
    primary: indigo
    accent: teal
    toggle:
      icon: material/brightness-7
      name: 라이트 모드
nav:
- Home: index.md
- Learning Roadmap: roadmap.md
- System Overview:
  - Information Source & System:
    - Overview: theory/foundations/communication-system-overview.md
    - Synchronization: blocks/synchronization.md
- Transmitter:
  - 01. Format:
    - Overview: blocks/format-input.md
  - 02. Source Encode:
    - Overview: blocks/source-encoding.md
  - 03. Encrypt:
    - Overview: blocks/encryption.md
  - 04. Channel Encode:
    - Overview: blocks/channel-encoding.md
    - "채널 코딩과 에러 제어: Block Coding, Hamming Code, Syndrome와 Convolution Coding": theory/coding/channel-coding-and-error-control.md
  - 05. Multiplex:
    - Overview: blocks/multiplexing.md
    - "다중화와 다중 접속": theory/multiple-access/multiplexing-and-multiple-access.md
  - 06. Pulse Modulate:
    - Overview: blocks/pulse-modulation.md
    - "아날로그 정보가 디지털 전송 파형이 되기까지": theory/foundations/analog-information-to-digital-waveforms.md
  - 07. Bandpass Modulate:
    - Overview: blocks/bandpass-modulation.md
    - "디지털 변조와 신호자리표: Bit에서 QAM까지": theory/modulation/digital-modulation-and-constellations.md
    - "디지털 대역통과 변조와 신호공간: 안테나·동기 검파·BPSK·QPSK 완전 정리": theory/modulation/bandpass-modulation-and-signal-space.md
    - "디지털 통신의 대역폭 효율과 I/Q 변조: Raised Cosine부터 직교 신호 복원까지": theory/modulation/bandwidth-efficiency-and-iq-modulation.md
    - "QPSK 완전 정리: I/Q 직교 변조부터 복소 기저대역 신호·Gray Encoding·위상 성상도와 대역폭 효율까지": theory/modulation/qpsk-and-complex-baseband.md
  - 08. Frequency Spread:
    - Overview: blocks/frequency-spreading.md
    - "Spread Spectrum: DSSS, FHSS, THSS와 대역확산": theory/multiple-access/spread-spectrum.md
  - 09. Multiple Access:
    - Overview: blocks/multiple-access-transmit.md
  - 10. XMT:
    - Overview: blocks/transmitter.md
    - "통신 시스템의 하드웨어 설계": applications/hardware/communication-hardware-design.md
- Channel:
  - 11. Channel:
    - Overview: blocks/channel.md
    - "Wireless Channel 완전 정리: Path Loss·Multipath·Fading·Delay Spread·Doppler부터 MIMO까지": theory/channel/wireless-channel-and-fading.md
    - "채널·잡음·BER와 Shannon Capacity": theory/channel/noise-ber-and-shannon-capacity.md
- Receiver:
  - 12. RCV:
    - Overview: blocks/receiver.md
  - 13. Multiple Access:
    - Overview: blocks/multiple-access-receive.md
  - 14. Frequency Despread:
    - Overview: blocks/frequency-despreading.md
  - 15. Demodulate & Sample:
    - Overview: blocks/demodulation-and-sampling.md
    - "M-ary 변조와 M-ASK·M-FSK: 대역폭 효율, 상관기 출력과 잡음의 영향": theory/modulation/m-ary-ask-fsk.md
    - "QPSK 수신기 완전 정리: Correlator·Matched Filter부터 Bandpass/Baseband 복조와 OQPSK까지": theory/modulation/qpsk-receivers-and-oqpsk.md
  - 16. Detect:
    - Overview: blocks/detection.md
  - 17. Demultiplex:
    - Overview: blocks/demultiplexing.md
  - 18. Channel Decode:
    - Overview: blocks/channel-decoding.md
  - 19. Decrypt:
    - Overview: blocks/decryption.md
  - 20. Source Decode:
    - Overview: blocks/source-decoding.md
  - 21. Format:
    - Overview: blocks/format-output.md
- Applications:
  - Destination & Bio / Implant:
    - Overview: applications/bio-implant/index.md
    - Bio/Implant Communication으로 연결하기: applications/bio-implant/bio-and-implant-communication.md
markdown_extensions:
- tables
- fenced_code
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ''
- pymdownx.arithmatex:
    generic: true
- toc:
    title: 이 글의 목차
    permalink: true
    toc_depth: 2-6
extra_javascript:
- assets/navigation.js
- assets/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
extra_css:
- assets/handbook.css
plugins:
- search
